spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/image_collection?useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:your_mysql_user}
    password: ${DB_PASSWORD:your_mysql_password}

wechat:
  miniapp:
    app-id: ${WECHAT_MINIAPP_APP_ID:your_wechat_app_id}
    app-secret: ${WECHAT_MINIAPP_SECRET:your_wechat_app_secret}
    code-env-version: ${WECHAT_MINIAPP_CODE_ENV_VERSION:release}

storage:
  type: cos
  local-dir: uploads
  local-base-path: /uploads
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:https://api.yourdomain.com}
  cos:
    secret-id: ${COS_SECRET_ID:your_tencent_cloud_secret_id}
    secret-key: ${COS_SECRET_KEY:your_tencent_cloud_secret_key}
    region: ${COS_REGION:ap-guangzhou}
    bucket: ${COS_BUCKET:your-bucket-1250000000}
    public-url-prefix: ${COS_PUBLIC_URL_PREFIX:https://your-cdn-or-cos-domain}
    key-prefix: ${COS_KEY_PREFIX:image-collection}
