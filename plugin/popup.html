<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>云图匣</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app-shell">
      <section id="loginSection" class="panel">
        <div class="panel-header">
          <div>
            <div class="eyebrow">WECHAT LOGIN</div>
            <h1>扫码登录云图匣</h1>
          </div>
          <button id="refreshLoginBtn" class="icon-button" type="button">刷新</button>
        </div>
        <p class="panel-text">使用微信扫码并在小程序中确认后，即可继续收藏当前网页图片。</p>
        <div class="qr-card">
          <img id="qrImage" class="qr-image" alt="微信扫码登录二维码" />
          <div id="loginStatus" class="login-status"></div>
        </div>
      </section>

      <section id="collectSection" class="panel" style="display: none;">
        <div class="panel-header">
          <div class="user-badge">
            <img id="avatarPreview" class="user-avatar" alt="用户头像" />
            <div>
              <div class="eyebrow">SIGNED IN</div>
              <div id="nicknameDisplay" class="user-name"></div>
            </div>
          </div>
          <button id="logoutBtn" class="icon-button" type="button">退出</button>
        </div>

        <div class="preview-card">
          <img id="preview" class="preview-image" alt="待收藏图片预览" style="display: none;" />
          <div id="previewPlaceholder" class="preview-placeholder">
            <div class="preview-placeholder-title">暂无待收藏图片</div>
            <div id="previewPlaceholderText" class="preview-placeholder-text">在网页图片上点击右键，再选择“收藏图片”。</div>
          </div>
          <div id="emptyState" class="empty-state">当前没有来自网页右键的待收藏图片。</div>
        </div>

        <label class="field-label" for="tagInput">标签</label>
        <div class="tag-editor">
          <div id="selectedTags" class="selected-tags"></div>
          <div id="tagInputWrap" class="tag-input-wrap">
            <input
              id="tagInput"
              class="text-input"
              type="text"
              placeholder="输入标签后回车，或使用逗号分隔"
              autocomplete="off"
            />
            <div id="tagSuggestions" class="tag-suggestions" style="display: none;"></div>
          </div>
        </div>

        <div id="saveFeedback" class="save-feedback"></div>
        <button id="saveBtn" class="primary-button" type="button">收藏图片</button>
      </section>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
